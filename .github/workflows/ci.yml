name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r backend/requirements.txt "pytest==8.*" "flask==3.1.*"
      - name: Backend unit tests (sandbox, workspace safety, verifier matcher, DORA metrics)
        run: cd backend && python -m pytest -q tests
      - name: Demo app test suite
        run: cd sample-apps/acme-tasks && python -m pytest -q

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build dashboard
        run: cd dashboard && npm ci --no-audit --no-fund && npm run build
